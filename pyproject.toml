[project]
name = "blightscan"
version = "1.0.0"
description = "Modular OSINT / reconnaissance tool for authorized security testing"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "dnspython>=2.4.0",
    "python-whois>=0.9.4",
]

[project.scripts]
blightscan = "blightscan.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blightscan"]
